services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      INSURECLEAR_CORS_ORIGINS: http://localhost:8080
      INSURECLEAR_JOB_DB: /app/data/jobs.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - insureclear-data:/app/data

  frontend:
    build:
      context: ./web/frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_API_KEY: ${INSURECLEAR_API_KEY:-}
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  insureclear-data:
