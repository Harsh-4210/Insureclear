<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">InsureClear architecture</title>
  <desc id="desc">Documents enter a durable API queue, pass through five AI agents, and produce a reviewed appeal package.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e75b6"/>
      <stop offset="1" stop-color="#155e9e"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#66c7f4"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 15px 'Segoe UI', sans-serif; fill: #a9c3d6; }
      .label { font: 700 16px 'Segoe UI', sans-serif; fill: #f8fafc; }
      .small { font: 400 13px 'Segoe UI', sans-serif; fill: #d7e7f2; }
      .tiny { font: 600 11px 'Segoe UI', sans-serif; fill: #8fc9e8; letter-spacing: 1px; }
      .line { stroke: #66c7f4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #8ab6cb; stroke-width: 2; stroke-dasharray: 8 8; fill: none; }
      .box { stroke: #367899; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1270" cy="100" r="180" fill="#0e75b6" opacity="0.12"/>
  <circle cx="120" cy="690" r="230" fill="#0f766e" opacity="0.10"/>

  <text x="70" y="72" class="title">InsureClear / system architecture</text>
  <text x="70" y="102" class="subtitle">Evidence in - reviewed appeal package out - with checkpoints, controls, and observable decisions</text>

  <rect x="70" y="155" width="220" height="180" rx="18" fill="#12304a" class="box" filter="url(#shadow)"/>
  <text x="95" y="190" class="tiny">01 / INTAKE</text>
  <text x="95" y="224" class="label">Case sources</text>
  <text x="95" y="254" class="small">Denial PDF or text</text>
  <text x="95" y="278" class="small">Policy PDF or text</text>
  <text x="95" y="302" class="small">Demo samples</text>

  <rect x="350" y="155" width="220" height="180" rx="18" fill="#12304a" class="box" filter="url(#shadow)"/>
  <text x="375" y="190" class="tiny">02 / CONTROL PLANE</text>
  <text x="375" y="224" class="label">FastAPI + queue</text>
  <text x="375" y="254" class="small">API-key auth</text>
  <text x="375" y="278" class="small">Limits + validation</text>
  <text x="375" y="302" class="small">SQLite durable jobs</text>

  <path d="M290 245 H340" class="line"/>

  <rect x="630" y="135" width="290" height="220" rx="18" fill="url(#blue)" class="box" filter="url(#shadow)"/>
  <text x="660" y="172" class="tiny">03 / EVIDENCE PIPELINE</text>
  <text x="660" y="207" class="label">Five-agent reasoning loop</text>
  <rect x="660" y="230" width="112" height="42" rx="9" fill="#ffffff" opacity="0.14"/>
  <text x="676" y="256" class="small">Auditor</text>
  <rect x="790" y="230" width="100" height="42" rx="9" fill="#ffffff" opacity="0.14"/>
  <text x="802" y="256" class="small">Policy</text>
  <rect x="660" y="285" width="112" height="42" rx="9" fill="#ffffff" opacity="0.14"/>
  <text x="670" y="311" class="small">IRDAI check</text>
  <rect x="790" y="285" width="100" height="42" rx="9" fill="#ffffff" opacity="0.14"/>
  <text x="802" y="311" class="small">Writer</text>

  <path d="M570 245 H620" class="line"/>

  <rect x="980" y="155" width="220" height="180" rx="18" fill="#12304a" class="box" filter="url(#shadow)"/>
  <text x="1005" y="190" class="tiny">04 / QUALITY GATE</text>
  <text x="1005" y="224" class="label">Judge + revision</text>
  <text x="1005" y="254" class="small">Score threshold: 0.75</text>
  <text x="1005" y="278" class="small">Up to 2 revisions</text>
  <text x="1005" y="302" class="small">Citation review metadata</text>

  <path d="M920 245 H970" class="line"/>
  <path d="M1060 345 C1060 430 780 430 780 365" class="dashed"/>
  <text x="850" y="420" class="tiny">REVISE WHEN BELOW THRESHOLD</text>

  <rect x="230" y="490" width="280" height="165" rx="18" fill="url(#green)" class="box" filter="url(#shadow)"/>
  <text x="260" y="526" class="tiny">05 / DURABLE STATE</text>
  <text x="260" y="560" class="label">Checkpoints + audit trail</text>
  <text x="260" y="590" class="small">Resume named cases</text>
  <text x="260" y="614" class="small">Recover queued jobs</text>
  <text x="260" y="638" class="small">Remove uploaded PDFs</text>

  <rect x="650" y="490" width="330" height="165" rx="18" fill="url(#blue)" class="box" filter="url(#shadow)"/>
  <text x="680" y="526" class="tiny">06 / OUTPUT PACKAGE</text>
  <text x="680" y="560" class="label">Reviewable artifacts</text>
  <text x="680" y="590" class="small">appeal_letter.txt</text>
  <text x="680" y="614" class="small">full_report.json</text>
  <text x="680" y="638" class="small">Live UI + download endpoints</text>

  <path d="M740 355 V480" class="line"/>
  <path d="M510 570 H640" class="line"/>

  <rect x="1060" y="490" width="220" height="165" rx="18" fill="#12304a" class="box" filter="url(#shadow)"/>
  <text x="1090" y="526" class="tiny">07 / SURFACES</text>
  <text x="1090" y="560" class="label">React + Streamlit</text>
  <text x="1090" y="590" class="small">Progress visibility</text>
  <text x="1090" y="614" class="small">Case analysis tabs</text>
  <text x="1090" y="638" class="small">Docker-ready frontend</text>

  <path d="M980 570 H1050" class="line"/>

  <text x="70" y="720" class="subtitle">Gemini-powered | IRDAI-aware | human review required before submission</text>
</svg>
